<!-- ============ Desktop / tablet bar ============ -->
<header
  class="fixed top-0 left-0 w-full z-[100] transition-all duration-500"
  [class.nav-scrolled]="!isAtTop"
  [class.nav-top]="isAtTop"
>
  <nav class="mx-auto flex items-center gap-2 px-5 md:px-10 h-[68px] md:h-[72px]">
    <!-- Logo -->
    <a routerLink="/home" class="flex items-center shrink-0 group" aria-label="Giiflix home">
      <img
        src="Giiflix.png"
        alt="Giiflix logo"
        class="h-[52px] w-auto md:h-[60px] transition-transform duration-500
               group-hover:scale-110 drop-shadow-[0_0_12px_rgba(229,9,20,0.45)]"
      />
    </a>

    <!-- Desktop links -->
    <div class="hidden md:flex items-center gap-7 ml-6 text-[15px]">
      <a
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        {{ link.label }}
      </a>
      <a
        href="https://luisegianyambao.jobs180.com"
        target="_blank"
        rel="noopener noreferrer"
        class="nav-link"
      >
        About Me
      </a>
    </div>

    <!-- Right side actions -->
    <div class="hidden md:flex items-center gap-3 ml-auto">
      <span
        class="flex items-center gap-2 text-[11px] tracking-wider uppercase text-emerald-300/90
               bg-emerald-500/10 border border-emerald-400/25 rounded-full px-3 py-1.5"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"
          ></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
        </span>
        Open to work
      </span>

      <a
        href="profiles/Luise_Gian_Yambao_Resume_2026.pdf"
        download="Luise_Yambao_Resume.pdf"
        class="btn btn-red px-4 py-2 text-[13px]"
      >
        <span class="material-icons text-[17px]">download</span>
        Resume
      </a>
    </div>

    <!-- Mobile burger -->
    <button
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
      class="md:hidden ml-auto relative h-11 w-11 rounded-full grid place-items-center
             backdrop-blur text-white border transition-all duration-300 active:scale-95"
      [ngClass]="
        isMenuOpen
          ? 'border-red-600 bg-red-600/20'
          : 'border-white/15 bg-black/70'
      "
    >
      <span class="burger" [class.open]="isMenuOpen">
        <i></i><i></i><i></i>
      </span>
    </button>
  </nav>

  <!-- thin red hairline that appears on scroll -->
  <div
    class="h-px w-full bg-gradient-to-r from-transparent via-red-600/60 to-transparent
           transition-opacity duration-500"
    [class.opacity-0]="isAtTop"
    [class.opacity-100]="!isAtTop"
  ></div>
</header>

<!-- ============ Mobile drawer ============ -->
<div
  class="md:hidden fixed inset-0 z-[99] transition-opacity duration-400"
  [class.opacity-0]="!isMenuOpen"
  [class.pointer-events-none]="!isMenuOpen"
  [class.opacity-100]="isMenuOpen"
>
  <!-- backdrop -->
  <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" (click)="closeMenu()"></div>

  <!-- panel -->
  <div
    class="absolute top-0 right-0 h-full w-[78%] max-w-xs bg-[#0b0b0b] border-l border-white/10
           px-7 pt-24 pb-10 flex flex-col transition-transform duration-500 ease-out"
    [class.translate-x-full]="!isMenuOpen"
    [class.translate-x-0]="isMenuOpen"
  >
    <a
      *ngFor="let link of links; let i = index"
      [routerLink]="link.path"
      routerLinkActive="text-white border-red-600"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="flex items-center gap-4 py-4 text-lg text-zinc-400 border-l-2 border-transparent pl-4
             hover:text-white hover:border-red-600 transition-all duration-300"
    >
      <span class="material-icons text-[20px] opacity-70">{{ link.icon }}</span>
      {{ link.label }}
    </a>

    <a
      href="https://luisegianyambao.jobs180.com"
      target="_blank"
      rel="noopener noreferrer"
      (click)="closeMenu()"
      class="flex items-center gap-4 py-4 text-lg text-zinc-400 border-l-2 border-transparent pl-4
             hover:text-white hover:border-red-600 transition-all duration-300"
    >
      <span class="material-icons text-[20px] opacity-70">person</span>
      About Me
    </a>

    <div class="mt-auto space-y-3">
      <a
        href="profiles/Luise_Gian_Yambao_Resume_2026.pdf"
        download="Luise_Yambao_Resume.pdf"
        class="btn btn-red w-full py-3 text-sm"
      >
        <span class="material-icons text-[18px]">download</span>
        Download Resume
      </a>

      <div class="flex items-center justify-center gap-5 pt-2">
        <a
          href="https://github.com/berlily29"
          target="_blank"
          rel="noopener noreferrer"
          class="text-zinc-500 hover:text-white transition-colors text-xs tracking-wide"
          >GitHub</a
        >
        <span class="text-zinc-700">•</span>
        <a
          href="https://www.linkedin.com/in/luise-gian-yambao-9a3757325"
          target="_blank"
          rel="noopener noreferrer"
          class="text-zinc-500 hover:text-white transition-colors text-xs tracking-wide"
          >LinkedIn</a
        >
      </div>
    </div>
  </div>
</div>
