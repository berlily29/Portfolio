<section class="relative w-full py-6 md:py-8 group/row">

  <!-- Row heading -->
  <div class="px-6 md:px-14 lg:px-20 mb-4" appReveal="up">
    <h2 class="text-white text-xl md:text-3xl font-semibold flex items-center gap-3">
      {{ title }}
      <span class="h-px flex-1 max-w-[120px] bg-gradient-to-r from-red-600/70 to-transparent"></span>
    </h2>
    <p *ngIf="subtitle" class="text-zinc-500 text-sm mt-1">{{ subtitle }}</p>
  </div>

  <!-- Left arrow -->
  <button
    type="button"
    *ngIf="showLeftArrow"
    (click)="scrollLeft()"
    aria-label="Scroll left"
    class="hidden md:grid absolute left-3 top-[58%] -translate-y-1/2 z-20 place-items-center
           h-14 w-14 rounded-full bg-black/70 border border-white/15 text-white backdrop-blur
           opacity-0 group-hover/row:opacity-100 hover:bg-red-600 hover:border-red-600
           hover:scale-110 transition-all duration-300"
  >
    <span class="material-icons">chevron_left</span>
  </button>

  <!-- Track -->
  <div
    #slider
    class="flex items-stretch gap-4 md:gap-5 overflow-x-auto no-scrollbar scroll-smooth
           snap-x snap-mandatory px-6 md:px-14 lg:px-20 py-4"
  >
    <article
      *ngFor="let item of items; let i = index"
      appReveal="up"
      [revealDelay]="i * 70"
      class="project-card snap-start shrink-0 w-[260px] sm:w-[300px] md:w-[330px]
             rounded-xl overflow-hidden border border-white/10 bg-[#131313]
             flex flex-col"
    >
      <!-- Thumbnail -->
      <div class="relative overflow-hidden aspect-video bg-black shrink-0">
        <img
          [src]="item.image"
          [alt]="item.alt"
          loading="lazy"
          class="h-full w-full object-cover object-top transition-transform duration-700
                 project-card__img"
        />

        <div
          class="absolute inset-0 bg-gradient-to-t from-black via-black/25 to-transparent
                 opacity-80"
        ></div>

        <!-- Year badge -->
        <span
          *ngIf="item.year"
          class="absolute top-3 left-3 text-[10px] tracking-widest uppercase px-2 py-1 rounded
                 bg-black/70 border border-white/15 text-zinc-300 backdrop-blur"
        >
          {{ item.year }}
        </span>

        <!-- Role badge -->
        <span
          *ngIf="item.role"
          class="absolute top-3 right-3 text-[10px] tracking-widest uppercase px-2 py-1 rounded
                 bg-red-600/85 text-white"
        >
          {{ item.role }}
        </span>
      </div>

      <!-- Body -->
      <div class="flex flex-col flex-1 p-5">
        <h3 class="text-white text-lg font-semibold leading-snug mb-2">
          {{ item.title }}
        </h3>

        <p class="text-[13px] text-zinc-400 leading-relaxed mb-4 line-clamp-4">
          {{ item.description }}
        </p>

        <div class="flex flex-wrap gap-1.5 mb-5">
          <span *ngFor="let tech of item.stack" class="chip">{{ tech }}</span>
        </div>

        <div class="mt-auto">
          <a
            *ngIf="item.link"
            [href]="item.link"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-red w-full py-2.5 text-[13px]"
          >
            <span class="material-icons text-[17px]">open_in_new</span>
            View Project
          </a>

          <span
            *ngIf="!item.link"
            class="flex items-center justify-center gap-2 w-full py-2.5 text-[13px]
                   rounded-lg border border-white/10 text-zinc-500"
          >
            <span class="material-icons text-[17px]">lock</span>
            Not publicly hosted
          </span>
        </div>
      </div>
    </article>
  </div>

  <!-- Right arrow -->
  <button
    type="button"
    *ngIf="showRightArrow"
    (click)="scrollRight()"
    aria-label="Scroll right"
    class="hidden md:grid absolute right-3 top-[58%] -translate-y-1/2 z-20 place-items-center
           h-14 w-14 rounded-full bg-black/70 border border-white/15 text-white backdrop-blur
           opacity-0 group-hover/row:opacity-100 hover:bg-red-600 hover:border-red-600
           hover:scale-110 transition-all duration-300"
  >
    <span class="material-icons">chevron_right</span>
  </button>
</section>
